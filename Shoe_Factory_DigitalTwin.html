<!DOCTYPE html><html><head><meta charset="utf-8"><title>Shoe Factory Digital Twin</title><style>body{margin:0;font-family:Arial}#info{position:absolute;top:10px;left:10px;background:#ffffffdd;padding:10px;z-index:10}#dash{position:absolute;right:10px;top:10px;width:320px;background:#111;color:#0f0;padding:12px;display:none;z-index:10}</style></head><body><div id="info">WASD Move | Mouse Look | Click Machine</div><div id="dash"></div><script type="module">import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';import {PointerLockControls} from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0xbfd1e5);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,40),new THREE.MeshStandardMaterial({color:0x808080}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(80,80);scene.add(grid);const controls=new PointerLockControls(camera,document.body);document.body.onclick=()=>controls.lock();camera.position.set(0,2,15);scene.add(controls.getObject());const machines=[];function addMachine(x,color,name){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(4,3,4),new THREE.MeshStandardMaterial({color}));b.position.y=1.5;g.add(b);g.position.x=x;g.userData={name};scene.add(g);machines.push(g);}addMachine(-25,0xffffff,'M01 Leather Cutting');addMachine(-15,0x0088ff,'M02 Stitching');addMachine(-5,0xff8800,'M03 Printing');addMachine(5,0x00aa00,'M04 Sole Assembly');addMachine(15,0xaa00aa,'M05 Inspection');addMachine(25,0x000088,'M06 Packaging');const dash=document.getElementById('dash');const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();window.addEventListener('click',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(machines,true);if(hit.length){const n=hit[0].object.parent.userData.name;dash.style.display='block';dash.innerHTML='<h3>'+n+'</h3><p>Status: Running</p><p>Output:'+Math.floor(Math.random()*500)+'</p><p>OEE:'+Math.floor(80+Math.random()*20)+'%</p><p>Alarm: None</p>';}});const keys={};onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;function animate(){requestAnimationFrame(animate);if(keys.w)controls.moveForward(.2);if(keys.s)controls.moveForward(-.2);if(keys.a)controls.moveRight(-.2);if(keys.d)controls.moveRight(.2);renderer.render(scene,camera);}animate();</script></body></html>
